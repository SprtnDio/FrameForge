[package]
name = "frameforge"
version = "1.0.0"
edition = "2021"
description = "FrameForge - DirectX 12 Low-Latency Capture & Frame Generation"
build = "build.rs"
include = [
    "Cargo.toml",
    "build.rs",
    "assets/logo.svg",
    "csrc/ffx_fsr3_bridge.cpp",
    "csrc/xess3_bridge.cpp",
    "csrc/dlss45_bridge.cpp",
    "src/main.rs",
    "src/i18n.rs",
    "src/config.rs",
    "src/logo.rs",
    "src/dx12.rs",
    "src/fsr3.rs",
    "src/xess3.rs",
    "src/dlss45.rs",
    "src/gbuffer.rs",
    "src/backend.rs",
    "src/capture.rs",
    "src/audio.rs",
    "src/telemetry.rs",
    "src/ui.rs",
    "src/ui_renderer.rs",
]

[[bin]]
name = "frameforge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
cpal = "0.15.3"
crossbeam-channel = "0.5"
egui = "0.29"
egui-winit = "0.29"
nokhwa = { version = "0.10", default-features = false, features = ["input-msmf"] }
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winit = "0.30"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[build-dependencies]
cc = "1"
winresource = { version = "0.1", default-features = false }
